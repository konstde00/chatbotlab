name: Deploy Humanlike-Bot Client and Server to Production

on:
  push:
    branches:
      - main
  # Deploy Infrastructure triggers this with `gh workflow run` once the AWS
  # resources exist, so the first app deploy needs no second manual click.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ── Run the full CI suite first ──────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  deploy_frontend:
    name: Deploy Frontend Humanlike-Bot Client to Production
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      # The API URL is baked into the bundle at build time. Leaving the secret
      # unset is a valid configuration: CloudFront proxies /api/* to the
      # backend on the same host it serves the app from, so the frontend falls
      # back to a relative /api base. Set it only to point the frontend at an
      # API somewhere else.
      - name: Report which API base the bundle will use
        env:
          VITE_API_URL: ${{ secrets.VITE_PROD_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_PROD_API_URL is not set — building against the relative /api base (same origin as CloudFront)."
          else
            echo "Building against $VITE_API_URL"
          fi

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_PROD_API_URL }}
        run: |
          cd web
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Sync S3 bucket
        run: |
          aws s3 rm s3://${{ secrets.AWS_S3_PROD_BUCKET_NAME_FRONTEND }} --recursive
          aws s3 sync web/build/ s3://${{ secrets.AWS_S3_PROD_BUCKET_NAME_FRONTEND }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_PROD_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy_backend:
    name: Deploy Backend Humanlike-Bot Server to Production
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Install AWS Elastic Beanstalk CLI
        run: |
          pip install awsebcli

      - name: Deploy Django to Elastic Beanstalk
        run: |
          cd api
          eb init -p docker ${{ secrets.AWS_BACKEND_APPLICATION_NAME }} --region us-east-1
          eb use ${{ secrets.AWS_PROD_BACKEND_ENVIRONMENT_NAME }}
          eb deploy --timeout 30
