# -----------------------------------------------------------------------------
# test-iac.yml — deploy to a throwaway AWS account for testing Terraform changes
#
# This workflow mirrors staging.yml exactly but uses TEST_* secrets that point
# at a separate AWS account. The existing staging and production deployments
# are completely untouched — they use different secrets and different accounts.
#
# How to use this workflow:
#   1. Run `cd infra/terraform && bash setup.sh` with credentials for the TEST account
#   2. Copy the 9 GitHub secrets printed at the end, prefixing each with TEST_
#      e.g. AWS_ACCOUNT_ID → TEST_AWS_ACCOUNT_ID
#   3. Also add TEST_REACT_APP_API_URL = http://<eb-cname from terraform output>
#   4. Push to the tf-iac branch — this workflow runs automatically
#
# To tear down the test environment when you are done:
#   cd infra/terraform && terraform destroy -var-file=terraform.tfvars
# -----------------------------------------------------------------------------

name: Deploy to TEST account (tf-iac branch only)

on:
  push:
    branches:
      - tf-iac

permissions:
  id-token: write
  contents: read

jobs:
  deploy_frontend:
    name: Build and deploy React frontend to test S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd generic_chatbot_frontend
          npm install

      - name: Build frontend
        env:
          # TEST_REACT_APP_API_URL = http://<eb-cname>/api from terraform output backend_api_url
          REACT_APP_API_URL: ${{ secrets.TEST_REACT_APP_API_URL }}
          CI: false
        run: |
          cd generic_chatbot_frontend
          npm run build

      - name: Configure AWS credentials (test account)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.TEST_AWS_ACCOUNT_ID }}:role/${{ secrets.TEST_AWS_ROLE_NAME }}
          # The OIDC credential exchange uses us-east-1 — Terraform creates
          # the OIDC provider and role in us-east-1 by default.
          aws-region: us-east-1

      - name: Sync frontend build to test S3 bucket
        run: |
          aws s3 rm s3://${{ secrets.TEST_AWS_S3_BUCKET_NAME_FRONTEND }} --recursive
          aws s3 sync generic_chatbot_frontend/build/ s3://${{ secrets.TEST_AWS_S3_BUCKET_NAME_FRONTEND }} --delete

      - name: Invalidate test CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.TEST_AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy_backend:
    name: Deploy Django backend to test Elastic Beanstalk environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials (test account)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.TEST_AWS_ACCOUNT_ID }}:role/${{ secrets.TEST_AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: Install Elastic Beanstalk CLI
        run: pip install awsebcli

      - name: Deploy Django to test Elastic Beanstalk
        run: |
          cd generic_chatbot
          eb init -p docker ${{ secrets.TEST_AWS_BACKEND_APPLICATION_NAME }} --region us-east-1
          eb use ${{ secrets.TEST_AWS_BACKEND_ENVIRONMENT_NAME }}
          eb deploy --timeout 30
